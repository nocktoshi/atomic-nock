[package]
name = "swap-client"
version.workspace = true
edition.workspace = true
license.workspace = true

# Client-side swap persistence: the SwapApi (worker endpoints) + SwapRepository
# over swap-core's encode/decode. The in-memory MemorySwapApi is the dev/test
# path (native + wasm); HttpSwapApi (gloo-net + bearer token) lands with auth.

[dependencies]
swap-core = { path = "../swap-core" }
serde_json = { workspace = true }
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# HttpSwapApi over the worker. gloo-net uses wasm-streams 0.5 (same as leptos),
# so no duplicate-symbol clash.
gloo-net = "0.6"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
js-sys = "0.3"

[dev-dependencies]
pollster = "0.4"

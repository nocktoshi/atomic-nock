[package]
name = "swap-web"
version.workspace = true
edition.workspace = true
license.workspace = true

# Leptos CSR app, built by Trunk. App shell + routing + the swap UI, wired to the
# verified crates (swap-core/-client/-evm/-nock). On-chain step actions that need
# the wallet/node bridges are gated; the create→list→open flow works in-browser
# against the in-memory dev repo.

[dependencies]
swap-core = { path = "../swap-core" }
swap-client = { path = "../swap-client" }
swap-evm = { path = "../swap-evm" }
swap-nock = { path = "../swap-nock" }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "console"] }

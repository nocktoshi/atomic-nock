[package]
name = "swap-nock"
version.workspace = true
edition.workspace = true
license.workspace = true

# Nockchain layer. The deterministic HTLC lock construction (lock.rs) is native
# + wasm and unit-tested. The gRPC client (grpc.rs) is wasm-only. The full tx
# build/sign/broadcast flow + the window.nockchain bridge are tracked separately
# (live-node validation required).

[dependencies]
iris-nockchain-types = { workspace = true }
iris-crypto = { workspace = true }
iris-ztd = { workspace = true }
swap-core = { path = "../swap-core" }
ibig = { version = "0.3", default-features = false }
getrandom = "0.2"

[features]
default = []
# The gRPC-Web client pulls tonic-web-wasm-client (wasm-streams 0.4), which
# collides with leptos's wasm-streams 0.5 in the SPA. Gate it so consumers that
# only need the deterministic lock/preimage code (e.g. swap-web) can opt out.
grpc = ["dep:iris-grpc-proto", "dep:tonic-web-wasm-client"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# gRPC-Web client: the iris-rs proto-generated client + the wasm transport.
iris-grpc-proto = { workspace = true, features = ["wasm"], optional = true }
tonic-web-wasm-client = { version = "0.6", optional = true }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
hex = "0.4"
serde_json = { workspace = true }
# Parity tests cross-check the EVM pure core against the original TS too.
swap-evm = { path = "../swap-evm" }

name = "nock-otc-kv"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# node:crypto fallback in @block65/webcrypto-web-push (browser push encryption).
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "api.atomicnock.com"
zone_name = "atomicnock.com"
custom_domain = true
enabled = true
previews_enabled = false

[[kv_namespaces]]
binding = "SWAPS"
id = "5851f03bf8614f54a6228a5aa18c6e65"

[[ratelimits]]
name = "RL_READ"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# Bundle the rose-wasm verifier as a CompiledWasm module (server-side signature
# verification). NOTE: the wasm is ~1MB gzipped — requires the Workers *Paid*
# plan (10MB compressed limit; the free tier is 1MB).
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true


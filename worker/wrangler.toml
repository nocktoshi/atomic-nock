name = "nock-otc-kv"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[routes]]
pattern = "api.atomicnock.com"
zone_name = "atomicnock.com"
custom_domain = true
enabled = true
previews_enabled = false

[[kv_namespaces]]
binding = "SWAPS"
id = "5851f03bf8614f54a6228a5aa18c6e65"

# Bundle the rose-wasm verifier as a CompiledWasm module (server-side signature
# verification). NOTE: the wasm is ~1MB gzipped — requires the Workers *Paid*
# plan (10MB compressed limit; the free tier is 1MB).
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true


name = "atomicnock-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# node:crypto fallback in @block65/webcrypto-web-push (browser push encryption).
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "https://atomicnock.com"
EMAIL_FROM = "notifications@atomicnock.com"
TELEGRAM_BOT_NAME = "atomicnockbot"
SOLVER_PKHS= "BUZWD8BdPehSUK7Er471SVLYsgbtAy9HwmpcfAckKxUL3RYHaf6RyGd"
# Max ms a POST /solver/rfq is held open awaiting the solver's quote.
RFQ_HOLD_MS = "10000"

# NEAR Intents 1Click: app-fee revenue (a NEAR account + bps, 100 = 1%). The JWT
# itself is a SECRET — set it with:  npx wrangler secret put ONECLICK_JWT
# (distribution-channel JWT removes the 0.2% platform fee on 1Click hops).
# ONECLICK_APPFEE_RECIPIENT = "yourname.near"
# ONECLICK_APPFEE_BPS = "50"

[[routes]]
pattern = "api.atomicnock.com"
zone_name = "atomicnock.com"
custom_domain = true
enabled = true
previews_enabled = false

[[kv_namespaces]]
binding = "SWAPS"
id = "5851f03bf8614f54a6228a5aa18c6e65"

[[ratelimits]]
name = "RL_READ"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_SOLVER"
namespace_id = "1004"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RL_RFQ"
namespace_id = "1005"
simple = { limit = 20, period = 60 }

[[queues.producers]]
binding = "SOLVER_IN"
queue = "solver-in"

[[queues.consumers]]
queue = "solver-out"
max_batch_size = 10
# Fire as soon as a message lands — an RFQ response must resolve the held POST
# without waiting to batch (latency, not throughput, is what matters here).
max_batch_timeout = 0
max_retries = 5
dead_letter_queue = "solver-out-dlq"

[[durable_objects.bindings]]
name = "MARKET_DO"
class_name = "Market"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RfqBoard"]
[[migrations]]
tag = "v2"
deleted_classes = ["RfqBoard"]
new_sqlite_classes = ["Market"]



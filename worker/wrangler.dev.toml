# Local dev config — fully isolated from production.
#
#   npm --prefix worker run dev      (or: cd worker && wrangler dev -c wrangler.dev.toml)
#
# `wrangler dev` runs in LOCAL mode by default: the KV namespace below is
# simulated on disk under worker/.wrangler/state and NEVER touches the deployed
# production namespace (5851f03bf8614f54a6228a5aa18c6e65). The dummy id is only a
# local label. Do NOT pass --remote unless you first create a real dev namespace
# (`wrangler kv namespace create SWAPS_DEV`) and paste its id here.
name = "atomicnock-dev"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# node:crypto fallback in @block65/webcrypto-web-push (browser push encryption).
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "SWAPS"
id = "0000000000000000000000000000dead"

# Same rate limiters as production (simulated locally by miniflare).
[[ratelimits]]
name = "RL_READ"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_SOLVER"
namespace_id = "1004"
simple = { limit = 600, period = 60 }

[[durable_objects.bindings]]
name = "RFQ_DO"
class_name = "RfqBoard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RfqBoard"]

# Bundle the rose-wasm verifier (server-side signature verification). No size
# limit in local dev.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# SESSION_SECRET is read from worker/.dev.vars in dev (see that file).
